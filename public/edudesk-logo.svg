<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EduDesk — School Management Software</title>
  <desc id="desc">EduDesk logo with a graduation cap, open book and dashboard details in a blue rounded-square icon, followed by the EduDesk wordmark.</desc>
  <defs>
    <linearGradient id="iconBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3296FF"/>
      <stop offset="1" stop-color="#073CCB"/>
    </linearGradient>
    <linearGradient id="wordBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#318BFA"/>
      <stop offset="1" stop-color="#1760E8"/>
    </linearGradient>
  </defs>

  <!-- App mark -->
  <g transform="translate(40 42)">
    <rect x="0" y="0" width="276" height="276" rx="58" fill="url(#iconBlue)"/>

    <!-- Graduation cap -->
    <path d="M38 79 138 37 238 79 138 122Z" fill="#FFFFFF"/>
    <path d="M78 105v33c34 21 86 21 120 0v-33l-60 26Z" fill="#FFFFFF"/>
    <path d="M237 80v56" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="237" cy="145" r="8" fill="#FFFFFF"/>

    <!-- Open book -->
    <path d="M48 168c29-3 61 10 90 43v38c-29-27-61-39-98-34Z" fill="#FFFFFF"/>
    <path d="M228 168c-29-3-61 10-90 43v38c29-27 61-39 98-34Z" fill="#FFFFFF"/>
    <path d="M44 173 38 232c39-10 68 2 100 24 32-22 61-34 100-24l-6-59" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 211v45" fill="none" stroke="#EAF3FF" stroke-width="5" stroke-linecap="round"/>

    <!-- Digital dashboard detail -->
    <g fill="#FFC83D">
      <rect x="120" y="150" width="18" height="18" rx="3"/>
      <rect x="144" y="150" width="18" height="18" rx="3"/>
      <rect x="120" y="174" width="18" height="18" rx="3"/>
      <rect x="144" y="174" width="18" height="18" rx="3"/>
    </g>
    <path d="M67 259c73 2 151-29 194-87" fill="none" stroke="#FFC128" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-weight="750" letter-spacing="-5">
    <text x="365" y="220" font-size="142" fill="#F8FAFC">Edu</text>
    <text x="625" y="220" font-size="142" fill="url(#wordBlue)">Desk</text>
  </g>
  <text x="372" y="278" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="500" letter-spacing="8" fill="#C5D0E8">SCHOOL MANAGEMENT SOFTWARE</text>
</svg>
