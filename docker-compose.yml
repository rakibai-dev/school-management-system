services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pass
      POSTGRES_DB: school_db
    ports:
      - "5433:5432"
    volumes:
      - school_pg_data:/var/lib/postgresql/data

volumes:
  school_pg_data:
